
name: VortexShop
version: 1.0.0
main: my.kingdomvortex.vortexshop.VortexShop
api-version: '26.3'
author: KingdomVortex
description: Advanced GUI Shop and Sell System

depend:
  - Vault

softdepend:
  - PlaceholderAPI

commands:
  shop:
    description: Open VortexShop
    usage: /shop

  se:
    description: Open Shop Editor
    usage: /se

  sr:
    description: Reload VortexShop
    usage: /sr

  sell:
    description: Open Sell GUI
    usage: /sell

permissions:
  vortexshop.admin:
    default: op
  vortexshop.use:
    default: true
  vortexshop.sell:
    default: true
  vortexshop.bypass:
    default: op
