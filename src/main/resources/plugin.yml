
name: VortexShop
version: 1.0.0
main: my.kingdomvortex.vortexshop.VortexShop
api-version: '26.3'
author: KingdomVortex
description: Advanced GUI Shop and Sell System

depend:
  - Vault

softdepend:
  - PlaceholderAPI

commands:
  shop:
    description: Open VortexShop
    usage: /shop
    aliases:
      - se

  sell:
    description: Open Sell GUI
    usage: /sell

  vortexshop:
    description: VortexShop administration
    usage: /vortexshop
    aliases:
      - vs
      - sr

permissions:
  vortexshop.admin:
    description: Full access to shop editor
    default: op

  vortexshop.use:
    description: Access to shop
    default: true

  vortexshop.sell:
    description: Access to sell GUI
    default: true

  vortexshop.bypass:
    description: Bypass shop restrictions
    default: op
